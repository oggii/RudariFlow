<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        height: 100%;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        color: #fff;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }
      .pill {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 14px;
        background: rgba(20, 20, 22, 0.92);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
        cursor: grab;
      }
      .pill:active { cursor: grabbing; }

      .mic-icon {
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        fill: rgba(255, 255, 255, 0.85);
      }
      body[data-state="transcribing"] .mic-icon { fill: #ffb74d; }

      .waveform {
        flex: 1 1 auto;
        height: 28px;
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .bar {
        flex: 1 1 0;
        min-width: 2px;
        height: 4px;
        background: rgba(255, 255, 255, 0.55);
        border-radius: 2px;
        transition: height 80ms ease-out, background 200ms ease;
      }
      body[data-state="recording"] .bar { background: #ff5c5c; }
      body[data-state="transcribing"] .bar {
        background: rgba(255, 183, 77, 0.85);
        animation: shimmer 1.2s ease-in-out infinite;
      }
      @keyframes shimmer {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      .cancel {
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: #fff;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 120ms ease;
      }
      .cancel:hover { background: rgba(255, 92, 92, 0.85); }
      .cancel svg { width: 10px; height: 10px; stroke: #fff; }
      .transcript {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        font-size: 12px;
        font-weight: 500;
        line-height: 1.3;
        color: rgba(255, 255, 255, 0.95);
        background: rgba(20, 20, 22, 0.92);
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        opacity: 0;
        pointer-events: none;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
        transition: opacity 120ms ease;
      }
      body[data-state="transcribing"] .transcript,
      body[data-state="polishing"] .transcript { opacity: 1; }
      /* AI cleanup: the Whisper text stays visible, labelled and gently pulsing. */
      body[data-state="polishing"] .transcript {
        justify-content: flex-start;
        gap: 10px;
        animation: polish 1.4s ease-in-out infinite;
      }
      body[data-state="polishing"] .transcript::before {
        content: attr(data-phase);
        flex: 0 0 auto;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(124, 138, 255, 0.22);
        color: #c9cfff;
        font-size: 11px;
        font-weight: 600;
      }
      @keyframes polish {
        0%, 100% { color: rgba(255, 255, 255, 0.95); }
        50% { color: rgba(255, 255, 255, 0.6); }
      }
      /* Reduced motion: nothing in the pill moves; its states still change, at once. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
      .notice {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.95);
        background: rgba(20, 20, 22, 0.92);
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        /* A long notice takes two lines. */
        padding: 0 18px;
        line-height: 1.25;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease;
      }
      body[data-state="notice"] .notice { opacity: 1; }

      /* Edit mode: the dictation will change the selected text. */
      .edit-chip {
        display: none;
        flex: 0 0 auto;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(124, 138, 255, 0.22);
        color: #c9cfff;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      body[data-edit="1"] .edit-chip { display: flex; }
      body[data-edit="1"] .mic-icon { fill: #9aa5ff; }
      body[data-edit="1"][data-state="recording"] .bar { background: #9aa5ff; }

      /* A meeting records: a small red dot, also between dictations (the
         window lets clicks through then, see recorder.rs rest_overlay). */
      .meeting-dot {
        display: none;
        position: absolute;
        top: 6px;
        right: 22px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff5c5c;
        box-shadow: 0 0 0 2px rgba(20, 20, 22, 0.92);
        pointer-events: none;
      }
      body[data-meeting="1"] .meeting-dot { display: block; }
      body[data-meeting="1"][data-state="ready"] .pill { visibility: hidden; }
      body[data-meeting="1"][data-state="ready"] .meeting-dot {
        top: auto;
        bottom: 14px;
        right: 50%;
        width: 12px;
        height: 12px;
        transform: translateX(50%);
      }
    </style>
  </head>
  <body data-state="ready">
    <div class="pill" id="pill">
      <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
      <span class="edit-chip" id="edit-chip"></span>
      <div class="waveform" id="waveform"></div>
      <button class="cancel" id="cancel" title="Cancel recording" aria-label="Cancel recording">
        <svg viewBox="0 0 12 12" fill="none">
          <path d="M2 2 L10 10 M10 2 L2 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="notice" id="notice"></div>
    <div class="transcript" id="transcript"></div>
    <div class="meeting-dot" id="meeting-dot" aria-hidden="true"></div>
    <script type="module">
      import { invoke } from "@tauri-apps/api/core";
      import { listen } from "@tauri-apps/api/event";
      import { getCurrentWindow } from "@tauri-apps/api/window";

      // ── Diagnostic logging into the same startup.log Rust writes ────
      function diag(msg) {
        try { invoke("diag_log", { source: "overlay", message: msg }); } catch (_) {}
      }
      window.__rfPing = diag;
      diag("script start");
      window.addEventListener("DOMContentLoaded", () => diag("DOMContentLoaded"));
      window.addEventListener("load", () => diag("load"));
      window.addEventListener("error", (e) => diag(`window error: ${e.message} at ${e.filename}:${e.lineno}`));
      window.addEventListener("unhandledrejection", (e) => diag(`unhandled rejection: ${e.reason}`));
      document.addEventListener("visibilitychange", () => diag(`visibility: ${document.visibilityState}`));

      const BAR_COUNT = 32;
      const HISTORY = new Array(BAR_COUNT).fill(0);
      const waveform = document.getElementById("waveform");
      const bars = [];
      for (let i = 0; i < BAR_COUNT; i++) {
        const b = document.createElement("div");
        b.className = "bar";
        waveform.appendChild(b);
        bars.push(b);
      }

      function paint() {
        for (let i = 0; i < BAR_COUNT; i++) {
          const v = HISTORY[i];
          const h = Math.max(3, Math.round(4 + v * 24));
          bars[i].style.height = h + "px";
        }
      }
      paint();

      let levelEventCount = 0;
      listen("audio-level", (event) => {
        levelEventCount++;
        // Log only the first level event after entering recording so we know the listener fired
        const lvl = Math.max(0, Math.min(1, Number(event.payload) || 0));
        HISTORY.shift();
        HISTORY.push(lvl);
        paint();
      }).then(() => diag("audio-level listener registered"));

      window.__overlayUpdate = (state) => {
        diag(`__overlayUpdate(${state}) bodyState=${document.body.dataset.state} levelEvents=${levelEventCount}`);
        document.body.dataset.state = state;
        // A notice's timer must not put "ready" over this state later.
        if (noticeTimer) {
          clearTimeout(noticeTimer);
          noticeTimer = null;
        }
        if (state !== "recording") {
          // Stop responding to incoming levels (set bars to baseline)
          for (let i = 0; i < BAR_COUNT; i++) HISTORY[i] = 0;
          paint();
        }
        if (state === "recording" || state === "ready") {
          delete document.body.dataset.edit;
        }
        if (state === "recording") {
          levelEventCount = 0;
          cumulative = "";
          transcriptEl.textContent = "";
        }
        if (state === "polishing") {
          const text = NOTICE_TEXT[pickLang()];
          transcriptEl.dataset.phase = document.body.dataset.edit ? text.editing : text.polishing;
        }
      };

      // Meeting mode: the red dot while a meeting records (Recorder::set_meeting_dot).
      window.__meetingDot = (on) => {
        if (on) document.body.dataset.meeting = "1";
        else delete document.body.dataset.meeting;
      };

      const transcriptEl = document.getElementById("transcript");
      let cumulative = "";
      listen("partial-transcript", (event) => {
        const p = event.payload || {};
        if (p.is_final) {
          // Final canonical text replaces whatever we accumulated.
          cumulative = String(p.text || "");
        } else {
          // New segment delta — append.
          const seg = String(p.text || "").trim();
          if (seg) cumulative = (cumulative + " " + seg).trim();
        }
        transcriptEl.textContent = cumulative;
      }).then(() => diag("partial-transcript listener registered"));

      const noticeEl = document.getElementById("notice");
      let noticeTimer = null;
      function showNotice(text, ms) {
        noticeEl.textContent = text;
        document.body.dataset.state = "notice";
        if (noticeTimer) clearTimeout(noticeTimer);
        noticeTimer = setTimeout(() => {
          noticeTimer = null;
          // Only while the notice still shows: a dictation that started
          // meanwhile keeps its state (as "ready" it would be hidden behind
          // the meeting's dot).
          if (document.body.dataset.state === "notice") document.body.dataset.state = "ready";
          invoke("diag_log", { source: "overlay", message: "notice timeout" });
        }, ms);
      }

      // i18n strings are owned by the main window. Keep a tiny EN/DE map here
      // since the overlay is a separate webview without access to the main
      // window's dictionary.
      const NOTICE_TEXT = {
        en: {
          audio_empty: "No speech detected", mic_error: "Microphone unavailable", polishing: "Polishing",
          mic_missing: "Microphone not found", no_mic: "No microphone found",
          rewrite_missing: "Last dictation not found here", rewrite_needs_ai: "Rewriting needs AI cleanup and Edit mode",
          rewrite_game: "No rewriting while the GPU is freed for a game",
          edit_game: "No editing while the GPU is freed for a game",
          editing: "Editing", word: "word", words: "words", edit_failed: "Edit failed, text unchanged",
          gpu_freed: "GPU freed", gpu_loading: "Loading models…", gpu_loaded: "Models loaded",
          gpu_failed: "Models could not be loaded",
          sb_hotkeys_off: "Sound hotkeys off", sb_hotkeys_on: "Sound hotkeys on",
          mt_limit: "Meeting stopped at 4 hours", mt_no_model: "Download a Whisper model first",
          mt_disk_full: "Not enough disk space for a meeting", mt_pc_check: "Wait for the PC check to finish",
          mt_failed: "The meeting could not start",
          no_model: "No speech model yet. Open RudariFlow to download one.", cancel: "Cancel recording",
        },
        de: {
          audio_empty: "Keine Sprache erkannt", mic_error: "Mikrofon nicht verfügbar", polishing: "Überarbeitung",
          mic_missing: "Mikrofon nicht gefunden", no_mic: "Kein Mikrofon gefunden",
          rewrite_missing: "Letztes Diktat hier nicht gefunden", rewrite_needs_ai: "Umschreiben braucht KI-Korrektur und Bearbeiten",
          rewrite_game: "Kein Umschreiben, solange die GPU für ein Spiel frei ist",
          edit_game: "Kein Bearbeiten, solange die GPU für ein Spiel frei ist",
          editing: "Bearbeiten", word: "Wort", words: "Wörter", edit_failed: "Bearbeiten ging nicht, Text unverändert",
          gpu_freed: "GPU freigegeben", gpu_loading: "Modelle werden geladen…", gpu_loaded: "Modelle geladen",
          gpu_failed: "Modelle konnten nicht geladen werden",
          sb_hotkeys_off: "Sound-Tastenkürzel aus", sb_hotkeys_on: "Sound-Tastenkürzel ein",
          mt_limit: "Meeting nach 4 Stunden beendet", mt_no_model: "Zuerst ein Whisper-Modell herunterladen",
          mt_disk_full: "Zu wenig Speicherplatz für ein Meeting", mt_pc_check: "Erst den PC-Check abwarten",
          mt_failed: "Das Meeting konnte nicht starten",
          no_model: "Noch kein Sprachmodell. Öffne RudariFlow und lade eines herunter.", cancel: "Aufnahme abbrechen",
        },
      };
      // The pill speaks the app's Display Language (Settings > General);
      // before the first settings were saved, Windows' language.
      let uiLanguage = "";
      function pickLang() {
        const lang = (uiLanguage || navigator.language || "en").toLowerCase();
        return lang.startsWith("de") ? "de" : "en";
      }
      function applyLanguage(lang) {
        uiLanguage = String(lang || "");
        const cancel = document.getElementById("cancel");
        cancel.title = NOTICE_TEXT[pickLang()].cancel;
        cancel.setAttribute("aria-label", cancel.title);
      }
      invoke("get_settings").then((s) => applyLanguage(s && s.uiLanguage)).catch(() => applyLanguage(""));
      listen("ui-language", (event) => applyLanguage(event.payload));

      // A dictation could not start: "no_model" (no speech model downloaded yet).
      listen("speech-notice", (event) => {
        const text = { no_model: NOTICE_TEXT[pickLang()].no_model }[event.payload];
        diag(`speech-notice received (${event.payload})`);
        if (text) showNotice(text, 3200);
      });

      listen("audio-empty", () => {
        diag("audio-empty received");
        const lang = pickLang();
        showNotice(NOTICE_TEXT[lang].audio_empty, 1500);
      }).then(() => diag("audio-empty listener registered"));

      // Edit mode: how many selected words the dictation will change (null: none).
      const editChip = document.getElementById("edit-chip");
      listen("edit-target", (event) => {
        const words = Number(event.payload) || 0;
        const text = NOTICE_TEXT[pickLang()];
        if (words > 0) {
          editChip.textContent = `✎ ${words} ${words === 1 ? text.word : text.words}`;
          document.body.dataset.edit = "1";
        } else {
          delete document.body.dataset.edit;
        }
      });

      // Text was selected while the GPU is freed for a game: Edit mode is
      // off, and nothing was pasted over the selection.
      listen("edit-game", () => {
        diag("edit-game received");
        showNotice(NOTICE_TEXT[pickLang()].edit_game, 2600);
      });

      listen("edit-failed", () => {
        diag("edit-failed received");
        showNotice(NOTICE_TEXT[pickLang()].edit_failed, 2400);
      });

      // { missing, name }: a missing device is named, e.g. "Microphone not
      // found: Fast Track", so a switched-off USB interface is obvious.
      listen("mic-error", (event) => {
        const info = event.payload || {};
        const t = NOTICE_TEXT[pickLang()];
        const text = !info.missing ? t.mic_error : info.name ? `${t.mic_missing}: ${info.name}` : t.no_mic;
        diag(`mic-error received (${info.missing ? "missing" : "open failed"})`);
        showNotice(text, 3000);
      });

      // "Rewrite last" could not start: "missing" (not in this field),
      // "needs-ai" (AI cleanup or Edit mode off, or No AI for the app) or
      // "game" (the GPU is freed for a game: no AI until it ends).
      listen("rewrite-failed", (event) => {
        const t = NOTICE_TEXT[pickLang()];
        diag(`rewrite-failed received (${event.payload})`);
        const text = { "needs-ai": t.rewrite_needs_ai, game: t.rewrite_game }[event.payload] || t.rewrite_missing;
        showNotice(text, 3000);
      });

      // Free GPU hotkey: "freed", "loading", "loaded" or "failed".
      listen("gpu-notice", (event) => {
        const t = NOTICE_TEXT[pickLang()];
        const text = { freed: t.gpu_freed, loading: t.gpu_loading, loaded: t.gpu_loaded, failed: t.gpu_failed }[event.payload];
        diag(`gpu-notice received (${event.payload})`);
        if (text) showNotice(text, 3000);
      });

      // Soundboard toggle hotkey: "hotkeys-off" or "hotkeys-on".
      listen("soundboard-notice", (event) => {
        const t = NOTICE_TEXT[pickLang()];
        const text = { "hotkeys-off": t.sb_hotkeys_off, "hotkeys-on": t.sb_hotkeys_on }[event.payload];
        diag(`soundboard-notice received (${event.payload})`);
        if (text) showNotice(text, 3000);
      });

      // Meeting mode: "limit" (stopped at 4 hours), or why a start from the
      // tray or the hotkey failed ("no_model", "disk_full", "pc_check", other codes).
      listen("meeting-notice", (event) => {
        const t = NOTICE_TEXT[pickLang()];
        const text =
          { limit: t.mt_limit, no_model: t.mt_no_model, disk_full: t.mt_disk_full, pc_check: t.mt_pc_check }[event.payload] ||
          t.mt_failed;
        diag(`meeting-notice received (${event.payload})`);
        showNotice(text, 3000);
      });

      document.getElementById("cancel").addEventListener("click", async (e) => {
        e.stopPropagation();
        try { await invoke("cancel_recording"); } catch (err) { console.error(err); }
      });

      const pill = document.getElementById("pill");
      const win = getCurrentWindow();
      pill.addEventListener("mousedown", (e) => {
        if (e.target.closest("button")) return;
        win.startDragging();
      });
    </script>
  </body>
</html>
