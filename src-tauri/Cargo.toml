[package]
name = "rudariflow"
version = "0.8.0"
description = "Sprache-zu-Text Diktier-App, lokal angetrieben von Whisper.cpp mit GPU-Beschleunigung"
authors = ["oggi <info@0ggi.ch>"]
edition = "2021"

[lib]
name = "rudariflow_lib"
crate-type = ["rlib"]

[features]
# GPU backends compiled into whisper.cpp. Release builds carry both and pick
# at runtime: CUDA on NVIDIA, Vulkan on AMD / Intel (or NVIDIA without CUDA).
# Without a CUDA Toolkit, build Vulkan only:
#   --no-default-features --features vulkan
default = ["cuda", "vulkan"]
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "~2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
enigo = "0.2"
reqwest = { version = "0.12", features = ["multipart", "json", "stream"] }
hound = "3.5"
tokio = { version = "1", features = ["full"] }
dirs = "6"
arboard = "3"
regex = "1"
getrandom = "0.3"
whatlang = "0.18"
futures-util = "0.3"
tauri-plugin-autostart = "2.5.1"
# raw-api re-exports whisper-rs-sys for ggml device enumeration.
whisper-rs = { version = "0.16", features = ["raw-api"] }

# whisper.cpp with RudariFlow's patches (patches/whisper-rs-sys); created by
# scripts/setup-whisper-patch.ps1.
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

[target.'cfg(windows)'.dependencies]
# Low-level mouse hook for side-button hotkeys (src/mouse_hotkey.rs); the
# foreground app for AI cleanup rules (src/foreground_app.rs); battery state
# (src/power.rs).
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
# Core Audio sessions for muting other apps while recording (src/mute.rs);
# a kill-on-close Job Object for the AI server (src/llm_server.rs).
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
] }

[[example]]
name = "spike"
path = "examples/spike.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"

[[example]]
name = "ai_bench"
path = "examples/ai_bench.rs"

[[example]]
name = "uia_probe"
path = "examples/uia_probe.rs"

[[example]]
name = "screen_probe"
path = "examples/screen_probe.rs"

[[example]]
name = "warm_bench"
path = "examples/warm_bench.rs"

[[example]]
name = "state_bench"
path = "examples/state_bench.rs"

[[example]]
name = "terms_bench"
path = "examples/terms_bench.rs"

[[example]]
name = "ctx_bench"
path = "examples/ctx_bench.rs"

[[example]]
name = "lang_bench"
path = "examples/lang_bench.rs"

[[example]]
name = "edit_bench"
path = "examples/edit_bench.rs"
