[package]
name = "rudariflow"
version = "0.5.0"
description = "Sprache-zu-Text Diktier-App, lokal angetrieben von Whisper.cpp mit GPU-Beschleunigung"
authors = ["oggi <info@0ggi.ch>"]
edition = "2021"

[lib]
name = "rudariflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# GPU backends compiled into whisper.cpp. Release builds carry both and pick
# at runtime: CUDA on NVIDIA, Vulkan on AMD / Intel (or NVIDIA without CUDA).
# Without a CUDA Toolkit, build Vulkan only:
#   --no-default-features --features vulkan
default = ["cuda", "vulkan"]
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
enigo = "0.2"
reqwest = { version = "0.12", features = ["multipart", "json", "stream"] }
hound = "3.5"
tokio = { version = "1", features = ["full"] }
dirs = "6"
arboard = "3"
futures-util = "0.3"
tauri-plugin-autostart = "2.5.1"
# raw-api re-exports whisper-rs-sys for ggml device enumeration.
whisper-rs = { version = "0.16", features = ["raw-api"] }

[[example]]
name = "spike"
path = "examples/spike.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"
